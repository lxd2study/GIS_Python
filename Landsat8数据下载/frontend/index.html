<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landsat 8 Explorer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside id="sidebar">

    <!-- Header -->
    <header id="app-header">
      <div id="header-logo">
        <div id="header-icon">L8</div>
        <div>
          <div id="header-title">Landsat 8 Explorer</div>
          <div id="header-sub">Microsoft Planetary Computer · USGS</div>
        </div>
      </div>
      <button id="auth-btn" onclick="openAuthModal()" title="配置 USGS EarthData 账号">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span id="auth-btn-label">未配置</span>
      </button>
    </header>

    <!-- Controls panel -->
    <div id="controls-panel">

      <!-- AOI -->
      <div class="ctrl-group">
        <div class="ctrl-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          感兴趣区域
        </div>
        <div id="bbox-display" class="aoi-box">
          <span id="bbox-hint">在地图上拖拽矩形框选范围</span>
          <div id="bbox-coords" style="display:none">
            <div class="coord-grid">
              <span class="coord-label">W</span><span class="coord-val" id="c-west"></span>
              <span class="coord-label">E</span><span class="coord-val" id="c-east"></span>
              <span class="coord-label">S</span><span class="coord-val" id="c-south"></span>
              <span class="coord-label">N</span><span class="coord-val" id="c-north"></span>
            </div>
          </div>
        </div>
        <button id="clear-bbox-btn" class="btn-link" onclick="clearBbox()" style="display:none">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          清除选区
        </button>
      </div>

      <!-- Date -->
      <div class="ctrl-group">
        <div class="ctrl-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          时间范围
        </div>
        <div class="date-row">
          <input type="date" id="start-date" value="2023-01-01" />
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
          <input type="date" id="end-date" value="2023-12-31" />
        </div>
      </div>

      <!-- Cloud + Level row -->
      <div class="ctrl-row-2">
        <div class="ctrl-group">
          <div class="ctrl-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg>
            云量上限 <span class="ctrl-val" id="cloud-value">20%</span>
          </div>
          <input type="range" id="cloud-cover" min="0" max="100" value="20"
                 oninput="updateCloudSlider(this)" />
        </div>

        <div class="ctrl-group">
          <div class="ctrl-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            数据级别
          </div>
          <div class="level-pills">
            <button class="pill active" data-level="L2" onclick="setLevel('L2', this)">L2</button>
            <button class="pill" data-level="L1" onclick="setLevel('L1', this)">L1</button>
          </div>
        </div>
      </div>

      <!-- Limit + Search -->
      <div class="ctrl-bottom">
        <select id="limit" class="select-sm">
          <option value="10">10 景</option>
          <option value="20" selected>20 景</option>
          <option value="50">50 景</option>
        </select>
        <button id="search-btn" class="btn-search" onclick="searchData()">
          <span id="search-btn-text">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            搜索
          </span>
          <span id="search-spinner" class="spinner" style="display:none"></span>
        </button>
      </div>

    </div>

    <!-- Results panel -->
    <div id="results-panel" style="display:none">
      <div id="results-header">
        <div id="results-meta">
          <span id="results-count"></span>
          <span id="results-level-badge"></span>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)" />
          全选
        </label>
      </div>

      <div id="results-list"></div>

      <div id="download-bar">
        <span id="selected-count">已选 0 景</span>
        <button class="btn-dl" onclick="downloadSelected()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          下载选中
        </button>
      </div>
    </div>

  </aside>

  <main id="map"></main>

  <!-- 下载管理器浮动按钮 -->
  <button id="dm-fab" onclick="toggleDM()" title="下载管理器">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7,10 12,15 17,10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span id="dm-badge" style="display:none"></span>
  </button>

  <!-- 下载管理器面板 -->
  <div id="dm-panel" style="display:none">
    <div id="dm-header">
      <span id="dm-title">下载管理器</span>
      <div id="dm-header-actions">
        <button class="dm-btn-ghost" onclick="clearCompleted()">清空已完成</button>
        <button class="dm-btn-ghost dm-close-btn" onclick="toggleDM()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div id="dm-mode-bar">
      <span class="dm-mode-label">下载到</span>
      <div class="dm-mode-pills">
        <button class="dm-pill active" data-mode="local"  onclick="setDLMode('local',  this)">本地</button>
        <button class="dm-pill"        data-mode="server" onclick="setDLMode('server', this)">服务端</button>
      </div>
      <span id="dm-server-path" style="display:none">→ downloads/</span>
    </div>

    <div id="dm-list">
      <div id="dm-empty">暂无下载任务</div>
    </div>

    <div id="dm-footer">
      <span id="dm-summary"></span>
    </div>
  </div>

  <!-- 波段选择弹窗 -->
  <div id="band-modal" class="modal-overlay" style="display:none" onclick="closeBandModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-info">
          <div class="modal-title">选择下载波段</div>
          <div class="modal-scene-id" id="modal-title"></div>
        </div>
        <button class="modal-close" onclick="closeBandModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="band-list"></div>
      <div class="modal-footer">
        <div class="preset-btns">
          <button class="btn-preset" onclick="selectPreset('rgb')">真彩色</button>
          <button class="btn-preset" onclick="selectPreset('nir')">假彩色</button>
          <button class="btn-preset" onclick="selectPreset('all')">全选</button>
        </div>
        <button class="btn-dl" onclick="confirmDownload()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          确认下载
        </button>
      </div>
    </div>
  </div>

  <!-- USGS 账号配置弹窗 -->
  <div id="auth-modal" class="modal-overlay" style="display:none" onclick="closeAuthModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()" style="width:380px">
      <div class="modal-header">
        <div class="modal-header-info">
          <div class="modal-title">USGS EROS 账号</div>
          <div class="modal-scene-id">下载 L1 数据需要 USGS EROS 账号，<a href="https://ers.cr.usgs.gov/register" target="_blank" style="color:var(--accent)">免费注册</a></div>
        </div>
        <button class="modal-close" onclick="closeAuthModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div style="padding:16px 18px;display:flex;flex-direction:column;gap:10px">
        <input id="earth-username" type="text"  placeholder="用户名 (Username)" style="width:100%" />
        <input id="earth-password" type="password" placeholder="密码 (Password)" style="width:100%" />
        <div id="auth-error" style="color:var(--danger);font-size:12px;display:none"></div>
      </div>
      <div class="modal-footer" style="justify-content:flex-end">
        <button class="btn-preset" onclick="closeAuthModal()">取消</button>
        <button class="btn-dl" id="auth-save-btn" onclick="saveEarthData()">
          <span id="auth-save-text">保存</span>
          <span id="auth-save-spinner" class="spinner" style="display:none"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast">
    <span id="toast-icon"></span>
    <span id="toast-msg"></span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="app.js"></script>
</body>
</html>
